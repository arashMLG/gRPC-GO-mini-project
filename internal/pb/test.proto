syntax = "proto3";
package test;
option go_package = "myGuy/internal/pb";

service Greeter {
    rpc SayHelloWorld (HelloWorldRequest) returns (HelloWorldReplay);
}

message HelloWorldRequest {
    string name = 1;
}

message HelloWorldReplay {
    string message = 1;
}

service Game {
    rpc Register (RegisterRequest) returns (RegisterReply);
    rpc Login    (LoginRequest)    returns (LoginReply);
    rpc Play     (PlayRequest)     returns (PlayReply);
    rpc Chat (stream ChatMessage) returns (stream ChatMessage);
    rpc Leaderboard (LeaderboardRequest) returns (stream LeaderboardReply);
}

message RegisterRequest {
    string username = 1;
    string password = 2;
}

message RegisterReply {
    string message = 1;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginReply {
    string token =1;
    string message = 2;
}

message PlayRequest {
    string token = 1;
    string word = 2;
}

message PlayReply {
    int32 points_change = 1;
    int32 total_points = 2;
    string message = 3;
}

message ChatMessage {
    string token =1;
    string username = 2;
    string text = 3;
}

message LeaderboardRequest {
    int32 top_n = 1;
}

message LeaderboardEntry {
    int32 rank = 1;
    string username = 2;
    int32 points = 3;
}

message LeaderboardReply {
    repeated LeaderboardEntry entries = 1;
}